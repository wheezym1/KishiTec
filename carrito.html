<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito · KISHI TEC</title>
<meta name="description" content="Revisa tu carrito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>

<div class="wrap"><div class="page-head"><div class="crumbs"><a href="index.html">Inicio</a> / Carrito</div><h1>Tu carrito</h1></div>
<section class="section" style="padding-top:10px"><div id="cartBox"></div></section></div>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let metodo = 'yape';
function draw() {
  const box = document.getElementById('cartBox');
  const rows = Cart.get().map(it => ({ p: Store.get(it.id), qty: it.qty })).filter(r => r.p);
  // quitar productos que ya no existen y ajustar al stock
  Cart.save(rows.map(r => ({ id: r.p.id, qty: Math.min(r.qty, r.p.stock) })).filter(r => r.qty > 0));
  const valid = Cart.get().map(it => ({ p: Store.get(it.id), qty: it.qty }));
  if (!valid.length) { box.innerHTML = '<div class="panel empty"><h3>Tu carrito está vacío</h3><p style="margin-bottom:18px">Explora la tienda y agrega tus favoritos.</p><a class="btn btn-gold" href="tienda.html">Ir a la tienda</a></div>'; return; }
  const subtotal = valid.reduce((a, r) => a + r.p.price * r.qty, 0);
  const ship = shippingFor(subtotal);
  box.innerHTML = `<div class="two">
    <div>
      <div class="panel" style="margin-bottom:20px">${valid.map(({ p, qty }) => `
        <div class="line">
          <a href="producto.html?id=${p.id}"><img src="${esc(p.image)}" alt="${esc(p.name)}"></a>
          <div><h4>${esc(p.name)}</h4><div class="sub">${money(p.price)} c/u</div>
            <div style="margin-top:8px;display:flex;align-items:center"><div class="qty"><button data-m="${p.id}" aria-label="Menos">−</button><span>${qty}</span><button data-p="${p.id}" data-max="${Math.min(p.stock, 20)}" aria-label="Más">+</button></div><button class="rm" data-r="${p.id}">Quitar</button></div></div>
          <div class="tot">${money(p.price * qty)}</div></div>`).join('')}</div>
      <form class="panel" id="f" novalidate><h2>Datos de envío</h2>
        <div class="row2"><div class="field"><label for="name">Nombre completo</label><input id="name" required autocomplete="name"></div>
        <div class="field"><label for="phone">Teléfono / WhatsApp</label><input id="phone" required inputmode="tel" placeholder="900 865 945" autocomplete="tel"></div></div>
        <div class="field"><label for="address">Dirección</label><input id="address" required placeholder="Calle, número, referencia" autocomplete="street-address"></div>
        <div class="field"><label for="city">Ciudad</label><input id="city" required placeholder="Lima, Arequipa, Cusco…" autocomplete="address-level2"></div>
        <h2 style="margin-top:22px">Método de pago</h2>
        <label class="pay-opt"><input type="radio" name="m" value="yape" ${metodo === 'yape' ? 'checked' : ''}><span><b>Yape</b><small>Te enviamos el número por WhatsApp para que pagues.</small></span></label>
        <label class="pay-opt"><input type="radio" name="m" value="plin" ${metodo === 'plin' ? 'checked' : ''}><span><b>Plin</b><small>Te enviamos el número por WhatsApp para que pagues.</small></span></label>
        <div id="err" class="msg err" hidden></div>
      </form>
    </div>
    <aside class="panel"><h2>Resumen</h2>
      <div class="sum-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div class="sum-row"><span>Envío</span><span>${ship ? money(ship) : 'Gratis'}</span></div>
      <div class="sum-row total"><span>Total</span><span>${money(subtotal + ship)}</span></div>
      ${ship ? `<p class="note">Te faltan ${money(CONFIG.envioGratisDesde - subtotal)} para envío gratis.</p>` : ''}
      <button class="btn btn-gold block" id="go" style="margin-top:18px">Enviar pedido por WhatsApp</button>
      <a class="btn btn-line block" style="margin-top:10px" href="tienda.html">Seguir comprando</a>
      <p class="note">Se abrirá WhatsApp con tu pedido listo. Confirmamos stock y te indicamos cómo pagar.</p></aside></div>`;
  const cur = id => Cart.get().find(i => i.id === id).qty;
  box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { Cart.set(+b.dataset.m, cur(+b.dataset.m) - 1); draw(); });
  box.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { Cart.set(+b.dataset.p, Math.min(+b.dataset.max, cur(+b.dataset.p) + 1)); draw(); });
  box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { Cart.set(+b.dataset.r, 0); draw(); });
  box.querySelectorAll('input[name=m]').forEach(r => r.onchange = () => { metodo = r.value; });
  document.getElementById('go').onclick = () => {
    const v = id => document.getElementById(id).value.trim();
    const err = document.getElementById('err'); err.hidden = true;
    if (!v('name') || !v('phone') || !v('address') || !v('city')) { err.textContent = 'Completa tus datos de envío para continuar.'; err.hidden = false; err.scrollIntoView({ block: 'center' }); return; }
    const lineas = valid.map(({ p, qty }) => `• ${qty} × ${p.name} — ${money(p.price * qty)}`).join('\n');
    const msg = `Hola Kishi Tec, quiero hacer este pedido:\n\n${lineas}\n\nSubtotal: ${money(subtotal)}\nEnvío: ${ship ? money(ship) : 'Gratis'}\nTOTAL: ${money(subtotal + ship)}\n\nNombre: ${v('name')}\nTeléfono: ${v('phone')}\nDirección: ${v('address')}, ${v('city')}\nPago: ${metodo === 'yape' ? 'Yape' : 'Plin'}`;
    window.open(waLink(msg), '_blank');
  };
}
draw();
</script>
</body>
</html>
